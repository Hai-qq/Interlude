name: Native desktop packages
on: [workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: interlude-${{ matrix.os }}
          path: out/**/make/
