<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>间歇 · 新版小窗</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e9e7e2;color:#514e48;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:28px 12px}header{text-align:center}h1{font-size:18px;font-weight:500;margin:0 0 9px}p{font-size:12px;margin:0;color:#807a70}iframe{display:block;width:420px;max-width:none;height:420px;transform:scale(.7619047619);transform-origin:top left;border:0;border-radius:14px;box-shadow:0 16px 48px #302b2420}.preview-window{width:320px;height:320px}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button{padding:7px 13px;border:1px solid #c5c0b7;border-radius:7px;background:transparent;color:inherit;font:12px inherit;cursor:pointer}button:hover{background:#fff7}</style></head><body><header><h1>间歇 · 新版小窗</h1><p>点击小鸟开始休息，右上角调整设置</p></header><div class="preview-window"><iframe src="/preview.html?view=tray" title="间歇交互预览"></iframe></div><nav aria-label="预览状态"><button data-mode="reset">日常</button><button data-mode="due">到时提醒</button><button data-mode="light">浅色</button><button data-mode="dark">深色</button></nav><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({type:'interlude-preview',mode:b.dataset.mode},location.origin));addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.type==='interlude-size'){frame.style.height=e.data.height+'px';document.querySelector('.preview-window').style.height=Math.round(e.data.height*320/420)+'px'}})</script></body></html>
